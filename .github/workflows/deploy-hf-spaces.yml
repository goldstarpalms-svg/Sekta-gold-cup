name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git clone "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" /tmp/hf-space
          # Clear old files (keep .git)
          cd /tmp/hf-space
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          # Copy app files
          cp -r "$GITHUB_WORKSPACE"/app.py .
          cp -r "$GITHUB_WORKSPACE"/requirements.txt .
          cp -r "$GITHUB_WORKSPACE"/.streamlit .
          cp -r "$GITHUB_WORKSPACE"/README_HF.md README.md
          # Push
          git add -A
          git diff --cached --quiet || (git commit -m "deploy from github $GITHUB_SHA" && git push)

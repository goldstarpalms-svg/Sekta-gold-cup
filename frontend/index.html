<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEKTA GOLD CUP — Ultimate AI</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Instrument Sans','system-ui','sans-serif'],
              mono: ['JetBrains Mono','monospace'],
              serif: ['Source Serif 4','Georgia','serif']
            },
            colors: {
              gold: { 50:'#FFF9E6', 100:'#FFECB3', 200:'#FFD966', 300:'#FFC700', 400:'#E6B300', 500:'#CC9900', 900:'#331A00' },
              sekta: { bg:'#0A0A0B', card:'#141415', border:'#232325', muted:'#8A8A90' }
            }
          }
        }
      }
    </script>
    <style>
      *{scrollbar-width:thin;scrollbar-color:#333 #0A0A0B}
      ::-webkit-scrollbar{width:6px;height:6px}
      ::-webkit-scrollbar-thumb{background:#333;border-radius:10px}
      .gold-glow{box-shadow:0 0 40px rgba(255,199,0,0.15),0 0 80px rgba(255,199,0,0.05)}
      .prose pre{white-space:pre-wrap}

      /* Landing page ambient blobs */
      .blob { position: absolute; border-radius: 9999px; filter: blur(90px); opacity: 0.55; }
      .blob-a { width: 480px; height: 480px; top: -160px; left: -120px; background: radial-gradient(circle, rgba(255,199,0,0.28), transparent 70%); animation: float-a 16s ease-in-out infinite; }
      .blob-b { width: 420px; height: 420px; top: 300px; right: -140px; background: radial-gradient(circle, rgba(255,138,0,0.20), transparent 70%); animation: float-b 20s ease-in-out infinite; }
      .blob-c { width: 380px; height: 380px; bottom: -140px; left: 30%; background: radial-gradient(circle, rgba(255,224,102,0.16), transparent 70%); animation: float-c 24s ease-in-out infinite; }
      @keyframes float-a { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,60px); } }
      @keyframes float-b { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-40px); } }
      @keyframes float-c { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-30px) scale(1.08); } }
    </style>
  </head>
  <body class="bg-[#0A0A0B] text-white antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
